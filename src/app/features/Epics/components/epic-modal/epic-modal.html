<div class="pt-5 px-64 bg-dark-gray/20 fixed inset-0 z-9999 ">
  <div class="bg-white p-8 m-auto w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between">
      <div class="flex gap-2 items-center">
        <img src="../../../../../assets/epicT.png" alt="" class="w-5 h-3.5" />
        <p class="text-dark-gray/60 font-bold text-[12px]">{{epic()?.epic_id}}</p>
      </div>
      <div class="flex gap-2 items-center">
        <img src="../../../../../assets/copy.png" alt="" class="w-3.75 h-1.75" />
        <p class="text-grayText text-body-md font-medium">Copy link</p>
        <button (click)="closeModal()" class="cursor-pointer">
        <img src="../../../../../assets/close.png" alt="" class=" w-3.5 h-3.5" />

        </button> 
      </div>
    </div>

    <div class="mt-4">
      <form [formGroup]="EpicForm">
        <div class="border-b border-b-light-gray/15">
          <input
            formControlName="title"
            type="text"
            value="Modern Architecture Overhaul"
            id="title"
            class="text-dark-gray text-xl w-full font-bold rounded-lg md:rounded-xl p-3 mb-8"
          />
        </div>
        <div class="mt-8">
          <textarea
            formControlName="description"
            type="text"
            placeholder="No Description"
           id="description"
            class="h-35 w-full text-dark-gray text-[16px] font-normal rounded-lg md:rounded-xl p-4"
          ></textarea
          >
        </div>

        <div class="grid grid-cols-3 gap-8 mt-8">
          <div class="grid gap-2">
            <p class="text-dark-gray/40 font-bold text-[10px] uppercase">Created By</p>
            <div class="flex gap-2">
              <a
                class="w-7 h-7 md:w-7 md:h-7 content-center text-center bg-primary text-[10px] text-white font-bold rounded-xl"
              >
                {{ getInitials(epic()?.created_by?.name) }}
            </a>
              <p class="text-dark-gray  font-medium md:font-semibold text-[12px] md:text-body-md">
               {{epic()?.created_by?.name}}
              </p>
            </div>
          </div>

          <div class="grid gap-2">
            <p class="text-dark-gray/40 font-bold text-[10px] uppercase">Assignee</p>
            <select formControlName="assignee_id"
              name="cars"
              id="cars"
              class="text-dark-gray py-3 pr-10 w-full font-normal rounded-lg md:rounded-lg px-4 "
            >
            @if(!epic()?.assignee?.name){
            <option value="null">no assignee</option>
            }
              @for(m of members(); track m){
              <option value="{{m.user_id}}"  
              >
                <div
                  class="w-7 h-7 md:w-6 md:h-6 md:bg-[#CDDDFF] md:text-[#51617E] text-[14px] font-bold content-center text-center rounded-xl"
                >
                  {{ getInitials(m.metadata.name) }}
                </div>
                <p class="text-dark-gray font-medium md:font-medium text-[12px] md:text-body-md">
                 {{m.metadata.name}}
                </p>
              </option>

              }
            </select>
          </div>

          <div class="grid gap-2">
            <p class="text-dark-gray/40 font-bold text-[10px] uppercase">Deadline</p>
            <div class="relative">
              <img src="../../../../../assets/calender.png" alt="" class="absolute top-4 left-2" />

              <input
                  formControlName="deadline"
                type="date"
                id="start-date"
                name="trip-start"
                [min]="today"
                class="text-dark-gray w-full font-normal rounded-lg md:rounded-sm p-2 px-6"
              />
            </div>
          </div>

          <div class="grid gap-2">
            <p class="text-dark-gray/40 font-bold text-[10px] uppercase">Created at</p>
            <div class="flex gap-2 items-center">
              <img src="../../../../../assets/calender.png" alt="" class="w-3 h-3.75" />
              <p class="text-dark-gray text-body-md font-medium">{{epic()?.created_at| date: 'MMM d,  y'}}</p>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="mt-8">
      <div class="flex justify-between">
        <h4>Tasks</h4>
        <p class="text-primary">+ Add Task </p>
      </div>

      <div class="mt-6 bg-surface-low border-2  border-light-gray/30 border-dashed rounded-lg p-12 ">
          <div class="place-items-center">
            <div class="bg-surface-highest w-12 h-12 rounded-lg content-center ">
                  <img src="../../../../../assets/settings.png" alt="" class="w-5 h-3.5 place-self-center " />

            </div>

            <p class="pt-4 text-dark-gray text-[16px] font-medium ">No tasks have been added to this epic yet</p>
           
           <div>
            <button class="text-white bg-linear-to-r from-primary to-primary-container py-2.5 px-6 mt-4 rounded-xs">+ Add Task</button>

           </div>
          </div>

      </div>
    </div>
  </div>
</div>
